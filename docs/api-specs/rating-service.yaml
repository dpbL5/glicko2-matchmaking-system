openapi: 3.0.3
info:
  title: Rating Service API
  description: |
    API specification for the rating service.
  version: 1.0.0

servers:
  - url: http://localhost:5005
    description: Local development

paths:
  /health:
    get:
      summary: Health check
      operationId: healthCheck
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  /rating/{id}:
    get:
      summary: Get player rating
      operationId: getPlayerRating
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Rating record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayerRating'
        '404':
          description: Rating not found

    post:
      summary: Update player rating
      operationId: updatePlayerRating
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RatingUpdateRequest'
      responses:
        '200':
          description: Rating updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayerRating'
        '404':
          description: Rating not found

components:
  schemas:
    PlayerRating:
      type: object
      properties:
        playerId:
          type: string
        rating:
          type: number
        rd:
          type: number
        volatility:
          type: number
    RatingUpdateRequest:
      type: object
      required:
        - rating
        - rd
        - volatility
      properties:
        rating:
          type: number
        rd:
          type: number
        volatility:
          type: number
