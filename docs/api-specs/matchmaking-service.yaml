openapi: 3.0.3
info:
  title: Matchmaking Service API
  description: |
    API specification for the matchmaking service.
  version: 1.0.0

servers:
  - url: http://localhost:5001
    description: Local development

paths:
  /health:
    get:
      summary: Health check
      operationId: healthCheck
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  /player:
    get:
      summary: Get player profiles
      operationId: getPlayers
      responses:
        '200':
          description: Player list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayerList'

  /player/{id}:
    get:
      summary: Get player by id
      operationId: getPlayerById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Player record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Player'

  /queue:
    post:
      summary: Enqueue player to pool
      operationId: enqueuePlayer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QueueEnqueueRequest'
      responses:
        '201':
          description: Player queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueueTicket'

  /queue/{playerId}:
    get:
      summary: Get queue status by player id
      operationId: getQueueStatus
      parameters:
        - name: playerId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Queue ticket
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueueTicket'
    delete:
      summary: Dequeue player from pool
      operationId: dequeuePlayer
      parameters:
        - name: playerId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Removed from queue

  /queue/search:
    post:
      summary: Find opponents in SR range
      operationId: searchOpponents
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QueueSearchRequest'
      responses:
        '200':
          description: Matching players
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueueSearchResponse'

  /mm:
    post:
      summary: Initialize a match
      operationId: initializeMatch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MatchInitRequest'
      responses:
        '201':
          description: Match initialized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Match'

  /match:
    post:
      summary: Create match record
      operationId: createMatch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MatchCreateRequest'
      responses:
        '201':
          description: Match created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Match'

  /match/{id}:
    get:
      summary: Get match by id
      operationId: getMatchById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Match record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Match'

  /match/{id}/result:
    post:
      summary: Update match status and result
      operationId: submitMatchResult
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MatchResultRequest'
      responses:
        '200':
          description: Match result accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatchResultResponse'

components:
  schemas:
    Player:
      type: object
      properties:
        id:
          type: string
        queued:
          type: boolean
        sr:
          type: number
    PlayerList:
      type: array
      items:
        $ref: '#/components/schemas/Player'
    QueueEnqueueRequest:
      type: object
      required:
        - playerId
        - sr
      properties:
        playerId:
          type: string
        sr:
          type: number
    QueueTicket:
      type: object
      properties:
        playerId:
          type: string
        sr:
          type: number
        status:
          type: string
        queuedAt:
          type: string
          format: date-time
    QueueSearchRequest:
      type: object
      required:
        - playerId
      properties:
        playerId:
          type: string
        minPlayers:
          type: integer
        maxSrDelta:
          type: number
    QueueSearchResponse:
      type: object
      properties:
        matched:
          type: boolean
        playerIds:
          type: array
          items:
            type: string
    MatchInitRequest:
      type: object
      required:
        - playerIds
      properties:
        playerIds:
          type: array
          items:
            type: string
    MatchCreateRequest:
      type: object
      required:
        - playerIds
      properties:
        playerIds:
          type: array
          items:
            type: string
        queueId:
          type: string
    Match:
      type: object
      properties:
        id:
          type: string
        status:
          type: string
          enum: [PENDING, IN_PROGRESS, FINISHED]
        playerIds:
          type: array
          items:
            type: string
    MatchResultRequest:
      type: object
      properties:
        winner:
          type: string
        result:
          type: string
    MatchResultResponse:
      type: object
      properties:
        matchId:
          type: string
        status:
          type: string
        updatedRatings:
          type: array
          items:
            type: object
            properties:
              playerId:
                type: string
              rating:
                type: number
