openapi: 3.0.3
info:
  title: Matchmaking Process Service API
  description: |
    API specification for initializing a match from a locked player group.
  version: 1.0.0

servers:
  - url: http://localhost:5001
    description: Local development

paths:
  /health:
    get:
      summary: Health check
      operationId: healthCheck
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  /mm:
    post:
      summary: Initialize a match from locked players
      operationId: initializeMatch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MatchInitRequest'
      responses:
        '201':
          description: Match initialized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatchInitResponse'

components:
  schemas:
    MatchInitRequest:
      type: object
      required:
        - playerIds
      properties:
        playerIds:
          type: array
          items:
            type: string
    MatchInitResponse:
      type: object
      properties:
        matchId:
          type: string
        playerIds:
          type: array
          items:
            type: string
