openapi: 3.0.3
info:
  title: Match Service API
  version: 1.0.0
  description: API contract for match creation, lookup, and result updates.
servers:
  - url: http://match-service:5002
    description: Internal Docker network
  - url: http://localhost:5002
    description: Direct local access
paths:
  /health:
    get:
      summary: Health check
      tags:
        - Health
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /matches:
    post:
      summary: Create match record
      tags:
        - Matches
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MatchCreateRequest'
      responses:
        '201':
          description: Match created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Match'
        '400':
          description: Invalid request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ValidationProblemDetails'
        '500':
          description: Unexpected server error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '503':
          description: Database unavailable
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /matches/{id}:
    get:
      summary: Get match by id
      tags:
        - Matches
      parameters:
        - name: id
          in: path
          required: true
          description: Match identifier (UUID)
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Match found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Match'
        '400':
          description: Invalid request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ValidationProblemDetails'
        '404':
          description: Match not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: Unexpected server error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '503':
          description: Database unavailable
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
    patch:
      summary: Submit match result and update status
      description: >
        Receives match result from the GameServer. Validates the request,
        publishes a MatchEndedEvent to the broker, and returns 200.
        The actual match update is handled asynchronously by MatchEndedConsumer.
      tags:
        - Matches
      parameters:
        - name: id
          in: path
          required: true
          description: Match identifier (UUID)
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MatchResultRequest'
      responses:
        '200':
          description: Match result accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatchResultResponse'
        '400':
          description: Invalid request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ValidationProblemDetails'
        '404':
          description: Match not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: Unexpected server error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '503':
          description: Database unavailable
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
components:
  schemas:
    HealthResponse:
      type: object
      properties:
        status:
          type: string
          example: ok
      required:
        - status
    MatchCreateRequest:
      type: object
      properties:
        playerIds:
          type: array
          minItems: 2
          uniqueItems: true
          items:
            type: string
            format: uuid
        queueId:
          type: string
          maxLength: 64
      required:
        - playerIds
    Match:
      type: object
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum:
            - PENDING
            - IN_PROGRESS
            - FINISHED
            - FAILED
        playerIds:
          type: array
          items:
            type: string
            format: uuid
      required:
        - id
        - status
        - playerIds
    MatchResultRequest:
      type: object
      properties:
        winner:
          type: string
          maxLength: 255
        result:
          type: string
          maxLength: 255
      required:
        - winner
        - result
    MatchResultResponse:
      type: object
      properties:
        matchId:
          type: string
          format: uuid
        status:
          type: string
          enum:
            - PENDING
            - IN_PROGRESS
            - FINISHED
            - FAILED
      required:
        - matchId
        - status
    ProblemDetails:
      type: object
      properties:
        type:
          type: string
          nullable: true
        title:
          type: string
          nullable: true
        status:
          type: integer
          format: int32
          nullable: true
        detail:
          type: string
          nullable: true
        instance:
          type: string
          nullable: true
    ValidationProblemDetails:
      allOf:
        - $ref: '#/components/schemas/ProblemDetails'
        - type: object
          properties:
            errors:
              type: object
              additionalProperties:
                type: array
                items:
                  type: string
